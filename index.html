<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="frame">
        <div class="top">
            <p>Etch-A-Sketch</p>
        </div>
        <div class="center">
            <div class="left">
                <div class="color-picker">
                    <button id="red" class="btn-color"></button>
                    <button id="blue" class="btn-color"></button>
                    <button id="green" class="btn-color"></button>
                    <button id="lightgreen" class="btn-color"></button>
                    <button id="pink" class="btn-color"></button>
                    <button id="black" class="btn-color"></button>
                    <button id="gray" class="btn-color"></button>
                    <button id="lightgray" class="btn-color"></button>
                    <button id="yellow" class="btn-color"></button>
                    <button id="gold" class="btn-color"></button>
                    <button id="orange" class="btn-color"></button>
                    <button id="purple" class="btn-color"></button>
                    <button id="brown" class="btn-color"></button>
                    <button id="cyan" class="btn-color"></button>
                    <button id="magenta" class="btn-color"></button>
                    <button id="navy" class="btn-color"></button>
                    <button id="teal" class="btn-color"></button>
                    <button id="indigo" class="btn-color"></button>
                    <button id="violet" class="btn-color"></button>
                    <button id="chocolate" class="btn-color"></button>
                </div>
                <div class="knob"></div>
            </div>
            <div class="canvas" style="cursor: crosshair;"></div>
            <div class="right">
                <div class="options">
                    <button class="btn-size">Size selection</button>
                    <button class="btn-rainbow"></button>
                    <button class="btn-eraser"><svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"
                            fill="currentColor" class="bi bi-eraser-fill" viewBox="0 0 16 16">
                            <path
                                d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm.66 11.34L3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z" />
                        </svg>


                    </button>
                    <button class="btn-reset"><svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"
                            fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16"
                            style="background: transparent;">
                            <path fill-rule="evenodd"
                                d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z" />
                            <path
                                d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z" />
                        </svg></button>
                </div>
                <div class="knob"></div>
            </div>
        </div>
        <div class="bottom">
            <p>Etch-A-Sketch by <a target="_blank" rel="noopener noreferrer" href="https://github.com/PiotrrKubas">Piotr
                    Kubas</a></p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
